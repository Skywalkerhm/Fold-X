<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深度估算与三维重建 · Fold-X</title><link rel="stylesheet" href="../assets/showcase.css"><nav class="nav"><a href="../index.html#depth-workbench">← 案例展示</a></nav><main><article class="case"><p class="label">CASE 10</p><h1>深度估算与三维重建</h1><p class="lead">从一张厨房照片中看出前后景的远近，或用一段绕积木拍摄的视频，生成可旋转查看的三维模型。</p><h2>看照片里的远近</h2><p>选择“加载默认样图”，对照厨房照片和深度图观察前景与背景，再移动焦点，观察清晰区域与虚化效果如何变化。这张样图在本次演示中显示的模型推理用时为 0.86 秒。</p><h2>绕积木看一圈</h2><p>选择“试用环拍视频”，加载 8 秒彩色积木示例。本次演示配准了全部 80 个视角，页面显示重建用时 63.1 秒。拖动旋转结果，切换原始彩色点云和三维表面，就能从不同角度查看积木的形状和相对大小。</p><a class="button" href="https://121.41.214.107:8880/">打开深度工作台，试用内置示例</a></article></main></html>
